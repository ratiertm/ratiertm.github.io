baseURL = 'https://ratiertm.github.io/'
languageCode = 'ko'
defaultContentLanguage = 'ko'
title = 'ratiertm'
theme = 'blowfish'

enableRobotsTXT = true
summaryLength = 30

[pagination]
  pagerSize = 10

[params]
  colorScheme = "blowfish"
  defaultAppearance = "dark"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  showScrollToTop = true

  [params.author]
    name = "마인드빌드"
    headline = "Web Developer from South Korea"
    links = [
      { github = "https://github.com/ratiertm" }
    ]

  [params.homepage]
    layout = "profile"
    showRecent = true
    recentLimit = 5

  [params.article]
    showDate = true
    showAuthor = true
    showReadingTime = true
    showTableOfContents = true
    showTaxonomies = true
    showWordCount = false
    showBreadcrumbs = true
    showPagination = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    pageRef = "posts"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    pageRef = "tags"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "Search"
    pageRef = "search"
    weight = 30

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"

[sitemap]
  changefreq = "daily"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
